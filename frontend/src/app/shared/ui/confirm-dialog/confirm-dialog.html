<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">
    {{ data.cancelText || 'Нет' }}
  </button>
  <button
    mat-flat-button
    type="button"
    [color]="data.danger ? 'warn' : 'primary'"
    (click)="confirm()"
  >
    {{ data.confirmText || 'Да' }}
  </button>
</mat-dialog-actions>
